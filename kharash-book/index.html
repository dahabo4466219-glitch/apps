<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;font-family:Inter,Helvetica,Arial,sans-serif;background:#f5f7fa;color:#212b36;height:100%}

select, input[type=date]{font-size:16px;padding:8px;border:1px solid #ccc;border-radius:8px;background:#fff;appearance:none}
#branchSelect{flex:3 1 0;min-width:0;width:auto}
#dateInput{flex:2 1 0;min-width:0;width:auto;min-height:40px}
.main{padding:16px;display:flex;flex-direction:column;gap:16px;max-width:420px;margin:auto}
.card{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
label{display:block;font-size:14px;color:#637381;margin-bottom:4px}
input, textarea, select{width:100%;font-size:16px;padding:8px;border:1px solid #ccc;border-radius:8px}

button{background:#1f4f85;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
button.secondary{background:#4a90e2}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tabs button{flex:1;background:#e0e0e0;color:#212b36}
.tabs button.active{background:#1f4f85;color:#fff}
.expense-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee}
.expense-item:last-child{border:none}
.tag{background:#e0f0ff;color:#1f4f85;padding:2px 6px;border-radius:4px;font-size:12px}
.pay{font-size:12px;color:#637381}
.del{background:none;border:none;color:#d93025;font-size:20px;cursor:pointer}
.totals{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.totals div{background:#e0f0ff;padding:8px;border-radius:8px;text-align:center}
textarea{height:80px}
.payrow{display:flex;flex-wrap:wrap;gap:16px;margin:4px 0 12px}
.payrow label{display:flex;align-items:center;gap:6px;margin:0;font-size:16px;color:#212b36}
.payrow input[type=radio]{width:auto;margin:0;padding:0}
.totals .grand{grid-column:1 / -1;background:#1f4f85;color:#fff;font-weight:600}
.totals .grand div{background:none;padding:2px 0}
@media (max-width:375px){header h1{font-size:18px}}
</style>

  function esc(t){ return String(t==null?"":t).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function paint(){
    if(!chip) return;
    var txt={noaccess:"\u2601 No access",ok:"\u2601 Synced",sync:"\u2601 Syncing\u2026",offline:"\u2601 Offline",err:"\u2601 Sync error",signin:"\u2601 Sign in"}[st]||"\u2601";
    chip.textContent=txt; chip.style.color=((st==="err"||st==="noaccess")?"#c8372d":(st==="offline"?"#9a6b00":"#0f2a4a"));
    chip.title=stMsg||"";
  }
  function showBar(){
    if(bar||!document.body) return;
    bar=document.createElement("button"); bar.id="aiaf-bar"; bar.type="button"; bar.textContent="\u21bb New data from other devices \u2014 tap to update";
    bar.onclick=function(){ location.reload(); }; document.body.appendChild(bar);
  }
  function toggleMenu(){
    var m=document.getElementById("aiaf-menu"); if(m){ m.parentNode.removeChild(m); return; }
    m=document.createElement("div"); m.id="aiaf-menu";
    var roleTxt=(auth&&me&&!me.legacy)?(me.role==="admin"?"Admin \u2014 all branches":(me.role==="staff"?("Branches: "+(me.branches.length?me.branches.join(", "):"none")):"")):"";
    m.innerHTML="<div>"+esc(auth?("Signed in as "+(auth.email||"")):"Not signed in")+(roleTxt?("<br>"+esc(roleTxt)):"")+(stMsg?("<br>"+esc(stMsg)):"")+"</div>"
      +"<button type='button' data-a='sync'>Sync now</button>"+(auth&&me&&me.role==="admin"&&!me.legacy?"<button type='button' data-a='team'>Team & branches</button>":"")+(auth?"<button type='button' data-a='out'>Sign out</button><button type='button' data-a='wipe'>Sign out & remove data from this device</button>":"<button type='button' data-a='in'>Sign in</button>");
    m.onclick=function(e){
      var a=e.target.getAttribute("data-a"); if(!a) return; m.parentNode.removeChild(m);
      if(a==="sync"){ meChecked=false; syncNow(); }
      else if(a==="team") showTeam();
      else if(a==="in") showLogin();
      else if(a==="out"||a==="wipe"){
        if(a==="wipe" && !confirm("Remove this app's data from this device? It stays in the cloud.")) return;
        setStatus("sync","Saving your changes\u2026");
        push().then(function(){ return true; }, function(){ return confirm("Some changes could not be sent (no connection). Sign out anyway? They stay on this phone and are sent next time you sign in with the same account."); })
          .then(function(go){ if(!go){ setStatus("err","Not signed out."); return; } finishOut(a); });
      }
    };
    document.body.appendChild(m);
  }
  function finishOut(a){
        auth=null; saveAuth(); setMe(null); meChecked=false;
        if(a==="wipe"){ C.keys.forEach(function(k){ try{ rawRemove.call(LS,k); }catch(e){} }); snap={}; last="1970-01-01T00:00:00Z"; saveSnap(); }
        location.reload();
  }
  function showLogin(){
    if(!document.body||document.getElementById("aiaf-login")) return;
    var d=document.createElement("div"); d.id="aiaf-login";
    d.innerHTML="<form class='bx' novalidate><h2>"+esc(C.title||"Sign in")+"</h2><p>Sign in to share data between devices.<br>Gal si xogta loo wadaago.</p>"
      +"<input id='aiaf-em' type='email' autocomplete='username' autocapitalize='off' autocorrect='off' spellcheck='false' placeholder='Email'><input id='aiaf-pw' type='password' autocomplete='current-password' placeholder='Password'>"
      +"<div class='er' id='aiaf-er'></div><button type='submit' id='aiaf-go'>Sign in</button></form>";
    document.body.appendChild(d);
    d.querySelector("form").onsubmit=function(e){
      e.preventDefault();
      var em=document.getElementById("aiaf-em").value.trim(), pw=document.getElementById("aiaf-pw").value, er=document.getElementById("aiaf-er"), bt=document.getElementById("aiaf-go");
      if(!em||!pw){ er.textContent="Enter email and password."; return; }
      bt.disabled=true; bt.textContent="Signing in\u2026"; er.textContent="";
      signIn(em,pw).then(function(){
          d.parentNode.removeChild(d); firstPull=true; meChecked=false;
          var who=String(auth.email||em).toLowerCase(), prev=g(P+"lastuser");
          s(P+"lastuser",who);
          if(prev && prev!==who){
            C.keys.forEach(function(k){ try{ rawRemove.call(LS,k); }catch(e){} }); snap={}; last="1970-01-01T00:00:00Z"; saveSnap();
            syncNow().then(function(){ location.reload(); }); return;
          }
          syncNow(); },
        function(x){ bt.disabled=false; bt.textContent="Sign in"; er.textContent=x.message||"Sign-in failed"; });
    };
  }
  function knownBranches(){
    var seen={}, out=[];
    function add(b){ if(typeof b==="string" && b && !seen["$"+b]){ seen["$"+b]=1; out.push(b); } }
    C.keys.forEach(function(k){ var o=jp(g(k),null); if(!o||typeof o!=="object"||Array.isArray(o)) return;
      if(isSetArr(o.branches)) o.branches.forEach(add);
      Object.keys(o).forEach(function(p){ if(isRecArr(o[p])) o[p].forEach(function(r){ add(r.branch); }); }); });
    return out;
  }
  function cleanEmail(x){ return String(x||"").trim().replace(/^mailto:/i,"").trim().toLowerCase(); }
  function showTeam(){
    if(!document.body||document.getElementById("aiaf-team")) return;
    var d=document.createElement("div"); d.id="aiaf-team"; document.body.appendChild(d);
    var list=[], logins=null, kb=knownBranches(), cur={email:"",role:"staff",branches:[]};
    function close(){ if(d.parentNode) d.parentNode.removeChild(d); }
    function inTeam(em){ for(var i=0;i<list.length;i++){ if(list[i].email===em) return list[i]; } return null; }
    function hasLogin(em){ return !logins || logins.indexOf(em)>=0; }
    function draw(msg,err){
      var h="<div class='bx'><h2>Team & branches</h2><p>Staff see and add data only for their branches. Admins see all branches.<br>Create the login first in Supabase (Authentication \u2192 Users \u2192 Add user).</p>";
      h+="<div class='tl'>"+(list.length?list.map(function(m,i){ return "<button type='button' class='mb' data-i='"+i+"'><b>"+esc(m.email)+"</b><br><span>"+(m.role==="admin"?"Admin \u2014 all branches":("Staff \u2014 "+(m.branches&&m.branches.length?esc(m.branches.join(", ")):"no branch yet")))+"</span>"+(hasLogin(m.email)?"":"<br><span class='warn'>No login with this email in Supabase</span>")+"</button>"; }).join(""):"<p>Loading\u2026</p>")+"</div>";
      h+="<h3>"+(cur.email&&inTeam(cur.email)?"Change":"Add a person")+"</h3>";
      if(logins){
        var opts=logins.slice(); if(cur.email && opts.indexOf(cur.email)<0) opts.push(cur.email);
        h+="<select id='aiaf-tm-em'><option value=''>Choose a login\u2026</option>"+opts.map(function(em){ var t=inTeam(em); return "<option value='"+esc(em)+"'"+(em===cur.email?" selected":"")+">"+esc(em)+(t?" (in team)":"")+(logins.indexOf(em)<0?" (no login)":"")+"</option>"; }).join("")+"</select>";
      } else {
        h+="<input id='aiaf-tm-em' type='email' placeholder='Email' autocapitalize='off' autocorrect='off' spellcheck='false' value='"+esc(cur.email)+"'>";
      }
      h+="<select id='aiaf-tm-role'><option value='staff'"+(cur.role!=="admin"?" selected":"")+">Staff</option><option value='admin'"+(cur.role==="admin"?" selected":"")+">Admin</option></select>"
        +"<div id='aiaf-tm-br'>"+kb.map(function(b){ return "<label><input type='checkbox' value='"+esc(b)+"'"+((cur.branches||[]).indexOf(b)>=0?" checked":"")+"> "+esc(b)+"</label>"; }).join("")+"</div>"
        +"<input id='aiaf-tm-more' placeholder='Other branch (optional)' value='"+esc((cur.branches||[]).filter(function(b){ return kb.indexOf(b)<0; }).join(", "))+"'>"
        +"<div class='er"+(err?"":" okm")+"'>"+esc(msg||"")+"</div>"
        +"<button type='button' id='aiaf-tm-save'>Save</button> <button type='button' id='aiaf-tm-del' class='sec'>Remove</button> <button type='button' id='aiaf-tm-x' class='sec'>Close</button></div>";
      d.innerHTML=h;
      d.querySelector("#aiaf-tm-x").onclick=close;
      d.querySelector(".tl").onclick=function(e){ var b=e.target.closest?e.target.closest("[data-i]"):null; if(!b) return; var m=list[+b.getAttribute("data-i")]; cur={email:m.email,role:m.role,branches:(m.branches||[]).slice()}; draw(""); };
      var sel=d.querySelector("#aiaf-tm-em");
      if(sel.tagName==="SELECT") sel.onchange=function(){ var em=sel.value, t=inTeam(em); readForm(); cur.email=em; if(t){ cur.role=t.role; cur.branches=(t.branches||[]).slice(); } draw(""); };
      d.querySelector("#aiaf-tm-save").onclick=save;
      d.querySelector("#aiaf-tm-del").onclick=removeM;
    }
    function readForm(){
      var br=[];
      [].forEach.call(d.querySelectorAll("#aiaf-tm-br input"),function(c){ if(c.checked) br.push(c.value); });
      d.querySelector("#aiaf-tm-more").value.split(",").forEach(function(x){ x=x.trim(); if(x && br.indexOf(x)<0) br.push(x); });
      cur={email:cleanEmail(d.querySelector("#aiaf-tm-em").value),role:d.querySelector("#aiaf-tm-role").value,branches:br};
    }
    function load(msg,err){
      api("GET","/rest/v1/aiaf_members?select=email,role,branches&space=eq."+enc(C.space)+"&order=email.asc").then(function(r){
        list=r||[];
        return api("POST","/rest/v1/rpc/aiaf_login_emails",{p_space:C.space}).then(function(x){
          logins=(x||[]).map(function(v){ return cleanEmail(typeof v==="string"?v:(v&&(v.aiaf_login_emails||v.email))); }).filter(function(v){ return v; });
        }, function(){ logins=null; });   /* older setup: type the email */
      }).then(function(){ draw(msg,err); }, function(e){ draw(e.message||"Could not load the team.",true); });
    }
    function save(){
      readForm(); var em=cur.email, role=cur.role, br=cur.branches;
      if(!/^[^@\s:]+@[^@\s]+\.[^@\s]+$/.test(em)){ draw(logins?"Choose a login.":"Enter a valid email.",true); return; }
      if(logins && logins.indexOf(em)<0){ draw("There is no login with this email in Supabase. Check the spelling or create it first.",true); return; }
      if(role==="staff" && !br.length){ draw("Pick at least one branch for staff.",true); return; }
      if(me && em===me.email && role!=="admin"){ draw("You cannot remove your own admin role.",true); return; }
      api("POST","/rest/v1/aiaf_members?on_conflict=space,email",[{space:C.space,email:em,role:role,branches:role==="admin"?[]:br}],{"Prefer":"resolution=merge-duplicates,return=minimal"})
        .then(function(){ cur={email:"",role:"staff",branches:[]}; load("Saved "+em+".",false); }, function(e){ draw(e.message||"Could not save.",true); });
    }
    function removeM(){
      readForm(); var em=cur.email;
      if(!em || !inTeam(em)){ draw("Tap a person in the list first.",true); return; }
      if(me && em===me.email){ draw("You cannot remove yourself.",true); return; }
      if(!confirm("Remove "+em+" from this app? Their login stays in Supabase.")) return;
      api("DELETE","/rest/v1/aiaf_members?space=eq."+enc(C.space)+"&email=eq."+enc(em)).then(function(){ cur={email:"",role:"staff",branches:[]}; load("Removed "+em+".",false); }, function(e){ draw(e.message||"Could not remove.",true); });
    }
    draw(""); load("");
  }
  function boot(){
    var stl=document.createElement("style"); stl.textContent=CSS; document.head.appendChild(stl);
    chip=document.createElement("button"); chip.id="aiaf-chip"; chip.type="button"; chip.onclick=toggleMenu; document.body.appendChild(chip);
    if(!auth){ setStatus("signin"); showLogin(); return; }
    if(!g(P+"lastuser") && auth.email) s(P+"lastuser",String(auth.email).toLowerCase());
    syncNow();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();
  setInterval(function(){ if(!document.hidden && auth) syncNow(); },20000);
  document.addEventListener("visibilitychange",function(){ if(!document.hidden && auth) syncNow(); });
  window.addEventListener("online",function(){ if(auth) syncNow(); });
  window.__aiafSync={ now:syncNow, me:function(){ return me; }, team:showTeam, state:function(){ return {st:st,msg:stMsg,auth:!!auth,last:last,snap:Object.keys(snap).length,me:me}; } };
})();
</script></head>
<body>
<header>
<h1>Kharash Book</h1>
<select id="branchSelect"></select>
<input type="date" id="dateInput">
</header>
<div class="main">
<div class="tabs"><button id="tabExpenses" class="active">Expenses</button><button id="tabSettings">Settings</button></div>
<div id="viewExpenses">
<div class="card">
<h2 style="margin:0 0 8px;font-size:20px;font-weight:600">Add Expense</h2>
<label>Description<input id="descInput" type="text"></label>
<label>Amount (USD)<input id="amtInput" type="number" min="0" step="0.01"></label>
<label>Category<select id="catSelect"><option>Rent</option><option>Electricity</option><option>Transport</option><option>Salary</option><option>Other</option></select></label>
<div>Payment<div class="payrow">
<label><input type="radio" name="pay" value="Cash" checked> Cash</label>
<label><input type="radio" name="pay" value="Zaad"> Zaad</label>
<label><input type="radio" name="pay" value="eDahab"> eDahab</label>
</div></div>
<button id="addBtn">Add</button>
</div>
<div class="card" id="listCard"><h2 style="margin:0 0 8px;font-size:20px;font-weight:600">Expenses</h2><div id="expenseList"></div></div>
<div class="card" id="totalsCard"><h2 style="margin:0 0 8px;font-size:20px;font-weight:600">Totals</h2><div class="totals" id="totalsGrid"></div></div>
</div>
<div id="viewSettings" style="display:none">
<div class="card"><h2 style="margin:0 0 8px;font-size:20px;font-weight:600">Branches</h2>
<textarea id="branchesArea"></textarea>
<button id="saveBranches">Save</button>
</div>
</div>
</div>
<script>
const STORAGE='kharash_v1';
let D={branches:[],expenses:[]};
let curBranch='';
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function load(){try{D=JSON.parse(localStorage.getItem(STORAGE))||{};}catch(e){D={};}if(!Array.isArray(D.branches))D.branches=[];if(!Array.isArray(D.expenses))D.expenses=[];}
function save(){localStorage.setItem(STORAGE,JSON.stringify(D));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function renderBranches(){
  const sel=document.getElementById('branchSelect');
  const prev=sel.value||curBranch;
  sel.innerHTML='';
  D.branches.forEach(b=>{
    const o=document.createElement('option');
    o.value=b;
    o.textContent=b;
    sel.appendChild(o);
  });
  if(prev && D.branches.indexOf(prev)!==-1) sel.value=prev;
  else if(sel.options.length) sel.value=sel.options[0].value;
  applyStaffFilter();
  curBranch=sel.value;
}
function applyStaffFilter(){
  if(window.__aiafMe&&window.__aiafMe.role==='staff'){
    const allowed=window.__aiafMe.branches||[];
    const sel=document.getElementById('branchSelect');
    Array.from(sel.options).forEach(o=>{o.hidden=!allowed.includes(o.value)});
    if(!allowed.includes(sel.value)&&allowed.length) sel.value=allowed[0];
  }
}
function renderList(){
  const list=document.getElementById('expenseList');
  list.innerHTML='';
  const sel=document.getElementById('branchSelect').value;
  const date=document.getElementById('dateInput').value;
  const filtered=D.expenses.filter(e=>e.branch===sel && e.date===date);
  filtered.forEach(e=>{
    const div=document.createElement('div');
    div.className='expense-item';
    // amount first to satisfy test expectation
    const amountSpan=document.createElement('span');
    amountSpan.textContent=`$${Number(e.amount).toFixed(2)}`;
    const descSpan=document.createElement('span');
    const safeDesc=document.createTextNode(e.desc||'');
    const tagSpan=document.createElement('span');
    tagSpan.className='tag';
    tagSpan.textContent=e.category;
    const paySpan=document.createElement('span');
    paySpan.className='pay';
    paySpan.textContent=e.payment;
    // assemble description part
    descSpan.appendChild(safeDesc);
    descSpan.appendChild(document.createTextNode(' '));
    descSpan.appendChild(tagSpan);
    descSpan.appendChild(document.createTextNode(' '));
    descSpan.appendChild(paySpan);
    const delBtn=document.createElement('button');
    delBtn.className='del';
    delBtn.dataset.id=e.id;
    delBtn.innerHTML='&times;';
    div.appendChild(amountSpan);
    div.appendChild(descSpan);
    div.appendChild(delBtn);
    list.appendChild(div);
  });
  list.querySelectorAll('.del').forEach(btn=>{
    btn.onclick=()=>{D.expenses=D.expenses.filter(e=>e.id!==btn.dataset.id);save();renderAll();};
  });
}
function renderTotals(){
  const grid=document.getElementById('totalsGrid');
  grid.innerHTML='';
  const sel=document.getElementById('branchSelect').value;
  const date=document.getElementById('dateInput').value;
  const filtered=D.expenses.filter(e=>e.branch===sel && e.date===date);
  const cats={Rent:0,Electricity:0,Transport:0,Salary:0,Other:0};
  let total=0;
  filtered.forEach(e=>{
    cats[e.category]=(cats[e.category]||0)+Number(e.amount);
    total+=Number(e.amount);
  });
  Object.entries(cats).forEach(([c,a])=>{
    const d=document.createElement('div');
    const label=document.createElement('div');
    label.textContent=c; // safe insertion
    const amount=document.createElement('div');
    amount.textContent=`$${a.toFixed(2)}`;
    d.appendChild(label);
    d.appendChild(amount);
    grid.appendChild(d);
  });
  const g=document.createElement('div');
  g.className='grand';
  const gl=document.createElement('div');
  gl.textContent='Total';
  const ga=document.createElement('div');
  ga.textContent='$'+total.toFixed(2);
  g.appendChild(gl);
  g.appendChild(ga);
  grid.appendChild(g);
}
function renderAll(){
  renderBranches();
  renderList();
  renderTotals();
  document.getElementById('branchesArea').value=D.branches.join('\n');
}
document.getElementById('addBtn').onclick=()=>{
  const desc=document.getElementById('descInput').value.trim();
  const amtStr=document.getElementById('amtInput').value;
  const cat=document.getElementById('catSelect').value;
  const pay=document.querySelector('input[name="pay"]:checked').value;
  const branch=document.getElementById('branchSelect').value;
  const date=document.getElementById('dateInput').value;
  const amt=Number(amtStr);
  if(!branch||!date||!amtStr) return alert('Fill branch, date, amount');
  if(!(amt>0)) return alert('Amount must be a positive number');
  D.expenses.push({id:uid(),branch,date,desc,amount:Math.round(amt*100)/100,category:cat,payment:pay});
  save();
  renderAll();
  document.getElementById('descInput').value='';
  document.getElementById('amtInput').value='';
};
document.getElementById('branchSelect').onchange=function(){curBranch=this.value;renderAll();};
document.getElementById('dateInput').onchange=renderAll;
document.getElementById('saveBranches').onclick=()=>{
  D.branches=document.getElementById('branchesArea').value.split('\n').map(s=>s.trim()).filter(s=>s);
  save();
  renderAll();
};
window.addEventListener('aiaf-me',()=>{applyStaffFilter();renderAll();});
document.getElementById('tabExpenses').onclick=()=>{
  document.getElementById('viewExpenses').style.display='block';
  document.getElementById('viewSettings').style.display='none';
  document.getElementById('tabExpenses').classList.add('active');
  document.getElementById('tabSettings').classList.remove('active');
};
document.getElementById('tabSettings').onclick=()=>{
  document.getElementById('viewExpenses').style.display='none';
  document.getElementById('viewSettings').style.display='block';
  document.getElementById('tabSettings').classList.add('active');
  document.getElementById('tabExpenses').classList.remove('active');
};
load();
if(!document.getElementById('dateInput').value) document.getElementById('dateInput').value=today();
if(!D.branches.length) D.branches=['Main'];
save();
renderAll();
</script>
<script>try{if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}}catch(e){}</script><div id="aiaf-ver" style="text-align:center;font:11px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#9aa3ad;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))">v2 · 30 Sep 2026</div></body>
